services:
  postgres:
    image: postgres:18-alpine
    container_name: chronos-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-chronos}
      POSTGRES_USER: ${POSTGRES_USER:-chronos}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-chronos_dev}
    # 5433 en el host a propósito: deja libre el 5432 para una instalación
    # nativa de PostgreSQL sin que se peleen por el puerto.
    ports:
      - "${POSTGRES_PORT:-5433}:5432"
    # Postgres 18+ guarda los datos en subdirectorios por versión mayor, así que el
    # volumen se monta en la raíz y no en /data como en las imágenes 17 y anteriores.
    volumes:
      - chronos-datos:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-chronos} -d ${POSTGRES_DB:-chronos}"]
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 10s

  adminer:
    image: adminer:5
    container_name: chronos-adminer
    restart: unless-stopped
    ports:
      - "${ADMINER_PORT:-8080}:8080"
    environment:
      ADMINER_DEFAULT_SERVER: postgres
      ADMINER_DESIGN: dracula
    depends_on:
      postgres:
        condition: service_healthy

volumes:
  chronos-datos:
